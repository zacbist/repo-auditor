rules:
  - id: aws-access-key-id
    description: AWS Access Key ID
    regex: "\\b(AKIA|ABIA|ACCA|ASIA)[0-9A-Z]{16}\\b"
    secretGroup: 0
    severity: critical
    tags: [aws, cloud]

  - id: aws-secret-access-key
    description: AWS Secret Access Key (near an aws/secret keyword)
    regex: "(?i)aws(.{0,20})?(secret|access)?[_-]?key.{0,5}[:=]\\s*['\"]([A-Za-z0-9/+=]{40})['\"]"
    secretGroup: 3
    keywords: ["aws"]
    entropy:
      enabled: true
      min: 4.0
    severity: critical
    tags: [aws, cloud]

  - id: github-pat
    description: GitHub Personal Access Token
    regex: "\\bghp_[A-Za-z0-9]{36}\\b"
    secretGroup: 0
    keywords: ["ghp_"]
    severity: critical
    tags: [github]

  - id: github-fine-grained-pat
    description: GitHub Fine-Grained Personal Access Token
    regex: "\\bgithub_pat_[A-Za-z0-9_]{22,255}\\b"
    secretGroup: 0
    keywords: ["github_pat_"]
    severity: critical
    tags: [github]

  - id: gitlab-pat
    description: GitLab Personal Access Token
    regex: "\\bglpat-[A-Za-z0-9\\-_]{20}\\b"
    secretGroup: 0
    keywords: ["glpat-"]
    severity: critical
    tags: [gitlab]

  - id: slack-token
    description: Slack API Token
    regex: "\\bxox[baprs]-[A-Za-z0-9-]{10,48}\\b"
    secretGroup: 0
    keywords: ["xox"]
    severity: critical
    tags: [slack]

  - id: slack-webhook-url
    description: Slack Incoming Webhook URL
    regex: "https://hooks\\.slack\\.com/services/T[A-Za-z0-9_]+/B[A-Za-z0-9_]+/[A-Za-z0-9_]+"
    secretGroup: 0
    keywords: ["hooks.slack.com"]
    severity: high
    tags: [slack]

  - id: stripe-api-key
    description: Stripe API Key
    regex: "\\b(sk|rk)_(live|test)_[A-Za-z0-9]{16,247}\\b"
    secretGroup: 0
    keywords: ["sk_live", "sk_test", "rk_live", "rk_test"]
    severity: critical
    tags: [stripe, payments]

  - id: google-api-key
    description: Google API Key
    regex: "\\bAIza[0-9A-Za-z\\-_]{35}\\b"
    secretGroup: 0
    keywords: ["AIza"]
    severity: high
    tags: [google, cloud]

  - id: npm-token
    description: npm Access Token
    regex: "\\bnpm_[A-Za-z0-9]{36}\\b"
    secretGroup: 0
    keywords: ["npm_"]
    severity: high
    tags: [npm]

  - id: pem-private-key
    description: PEM-format Private Key
    regex: "-----BEGIN ((RSA|EC|DSA|OPENSSH|PGP) )?PRIVATE KEY-----"
    secretGroup: 0
    keywords: ["PRIVATE KEY"]
    severity: critical
    tags: [private-key]
    hashScope: file

  - id: generic-password-assignment
    description: Generic password assignment
    regex: "(?i)(password|passwd|pwd)\\s*[:=]\\s*['\"]([^'\"\\s]{6,})['\"]"
    secretGroup: 2
    keywords: ["password", "passwd", "pwd"]
    severity: medium
    tags: [generic, password]

  - id: generic-secret-assignment
    description: Generic secret/API key/token assignment
    regex: "(?i)(secret|api[_-]?key|token)\\s*[:=]\\s*['\"]([A-Za-z0-9\\-_/+=]{4,})['\"]"
    secretGroup: 2
    keywords: ["secret", "api_key", "apikey", "api-key", "token"]
    entropy:
      enabled: true
      min: 3.0
    severity: medium
    tags: [generic]

  - id: generic-bearer-token
    description: Generic Bearer token in an Authorization header
    regex: "(?i)bearer\\s+([A-Za-z0-9\\-_.=]{20,})"
    secretGroup: 1
    keywords: ["bearer"]
    entropy:
      enabled: true
      min: 3.0
    severity: medium
    tags: [generic, http]

  - id: generic-high-entropy-string
    description: High-entropy string near a credential-related keyword
    regex: "(?i)(key|token|secret|password|credential|auth)[A-Za-z0-9_]*\\s*[:=]\\s*['\"]([A-Za-z0-9+/=_\\-]{20,})['\"]"
    secretGroup: 2
    keywords: ["key", "token", "secret", "password", "credential", "auth"]
    entropy:
      enabled: true
      min: 4.2
    severity: low
    tags: [generic, entropy]
